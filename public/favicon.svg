<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D334A"/>
      <stop offset="100%" stop-color="#1A1F33"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D52"/>
      <stop offset="100%" stop-color="#EE3137"/>
    </linearGradient>
  </defs>

  <!-- Base Badge with Soft Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="12"/>

  <!-- Icon Mark: Stylized Ear + Sound Waves + Smile -->
  <g transform="translate(10, 5)">
    <!-- Main Outer Ear Curve (Vibrant Red) -->
    <path d="M 230,115 C 325,115 375,175 375,250 C 375,320 330,370 270,390 C 235,402 210,385 210,360 C 210,342 225,332 245,325 C 285,310 312,282 312,245 C 312,198 280,165 230,165 C 190,165 162,185 150,215 C 145,228 132,235 118,230 C 104,225 97,210 103,196 C 122,148 168,115 230,115 Z" fill="url(#redGrad)"/>
    
    <!-- Inner Sound Wave 1 (Light Blue/Cyan accent) -->
    <path d="M 225,210 C 255,210 275,228 275,250 C 275,272 255,290 225,290 C 210,290 200,280 200,268 C 200,258 208,250 220,248 C 232,246 240,240 240,235 C 240,228 232,225 225,225 C 215,225 208,220 208,212 C 208,204 215,210 225,210 Z" fill="#60A5FA"/>

    <!-- Dynamic Soundwaves Emitting from Ear (White/Red Glow) -->
    <path d="M 395,190 A 90,90 0 0,1 395,310" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.95"/>
    <path d="M 435,160 A 140,140 0 0,1 435,340" fill="none" stroke="url(#redGrad)" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>